services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flood_monitoring
      POSTGRES_USER: flood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood -d flood_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
